; Vorlage fuer die Android-Ausgabe — nach `godot/export_presets.cfg` KOPIEREN.
;
; Sie liegt hier und nicht dort, weil `export_presets.cfg` in `.gitignore` steht: Godot
; schreibt in diese Datei auch Schluesselpfade und, bei einer Freigabe-Ausgabe, Passwoerter.
; Was Passwoerter tragen kann, gehoert nicht ins Repository.
;
; Diese Vorlage traegt keine. Der Debug-Schluessel kommt aus den EDITOR-Einstellungen
; (Editor ▸ Editor-Einstellungen ▸ Export ▸ Android) und steht bewusst nicht hier — er gilt
; fuer den Rechner, nicht fuer das Projekt.
;
; Nach dem Kopieren: Godot neu starten (die Datei wird beim Start gelesen), dann
; Projekt ▸ Exportieren… ▸ Android ▸ Projekt exportieren.
;
; Alles Weitere steht in `docs/ANDROID_EXPORT.md`.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

; Ohne Gradle. Der eigene Gradle-Build wird erst gebraucht, wenn Plugins dazukommen
; (Werbung, Play-Dienste); bis dahin ist er nur mehrere Minuten Bauzeit und eine
; Fehlerquelle mehr.
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""

; NUR arm64. Jede weitere Architektur verdoppelt die Datei, und jedes Telefon der letzten
; acht Jahre ist arm64 — die anderen anzuhaken macht die APK groesser und sonst nichts.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false

version/code=1
version/name="0.1"
package/unique_name="de.rustandlead.game"
package/name="Rust & Lead"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false

launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""

; Quer, wie das Spiel gebaut ist (siehe `window/handheld/orientation` in project.godot).
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

; Kein Netz, keine Kamera, kein Standort — das Spiel braucht nichts davon, und jede
; Berechtigung, die es nicht braucht, ist eine, die jemand rechtfertigen muss.
permissions/internet=false

apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""

command_line/extra_args=""
